name: Disponibilitat free tour Breslau

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minuts (hora UTC; GitHub pot endarrerir-ho uns minuts)
  workflow_dispatch:          # botó per executar-lo a mà

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Comprova el 29/11
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_DATE: "2026-11-29"
        run: python3 check.py
